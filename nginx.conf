server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://admin-prod.default.svc.cluster.local;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "";
        # admin_be의 Pod 생성/마이그레이션 동기 처리(최대 600s)가 nginx 기본
        # proxy_read_timeout(60s)에 끊기지 않도록 여유 있게 늘린다.
        proxy_connect_timeout 650s;
        proxy_send_timeout 650s;
        proxy_read_timeout 650s;
    }

    location /pod-status/ {
        proxy_pass http://containerssh-config-service.ailab-infra.svc.cluster.local/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 650s;
        proxy_send_timeout 650s;
        proxy_read_timeout 650s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
